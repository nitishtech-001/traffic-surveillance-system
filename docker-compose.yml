version: '3.8'

services:
  # -----------------------------------------------
  # Backend Service (FastAPI)
  # -----------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "cd backend && 
             uv pip install --system -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend # Mounts your backend code for hot-reloading

  # -----------------------------------------------
  # Frontend Service (React / Vite / CRA)
  # -----------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "cd frontend && 
             npm install && 
             npm run dev -- --host 0.0.0.0" # --host allows Docker to expose it
    ports:
      - "5173:5173" # Change to 3000 if using Create React App instead of Vite
    volumes:
      - ./frontend:/app/frontend # Mounts your frontend code for hot-reloading
      - /app/frontend/node_modules # Prevents local node_modules from overriding container
    environment:
      - CHOKIDAR_USEPOLLING=true # Ensures file changes register across Docker on Windows/Mac
